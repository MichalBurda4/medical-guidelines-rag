[project]
name = "medirag-server"
version = "0.0.0"
description = "MediRAG FastAPI + Ollama embeddings + Chroma backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "chromadb-client>=1.0.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
