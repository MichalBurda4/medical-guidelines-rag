server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Up to 10 files × 20 MB accepted by the API. nginx defaults to 1 MB and would
    # answer 413 before FastAPI ever sees the upload.
    client_max_body_size 210m;

    location /api/ {
        # No trailing slash on proxy_pass: /api/... must be forwarded unchanged.
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Uploads embed every chunk and chat waits on a cloud LLM.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
